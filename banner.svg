<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="960" height="320" shape-rendering="crispEdges">
  <style>
    .blink{animation:b 1s steps(1) infinite}
    .eye{animation:e 4s steps(1) infinite}
    .bob{animation:o 1.2s steps(2) infinite}
    .code{animation:c 3s steps(6) infinite}
    .star{animation:s 2s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    @keyframes e{0%,92%{opacity:1}93%,100%{opacity:0}}
    @keyframes o{50%{transform:translateY(-1px)}}
    @keyframes c{from{transform:translateX(0)}to{transform:translateX(-24px)}}
    @keyframes s{50%{opacity:.2}}
  </style>
  <!-- cielo nocturno -->
  <rect width="240" height="80" fill="#0a1220"/>
  <rect y="50" width="240" height="30" fill="#0f1b30"/>
  <g fill="#c9d1d9" class="star"><rect x="14" y="8" width="1" height="1"/><rect x="52" y="16" width="1" height="1"/><rect x="200" y="10" width="1" height="1"/><rect x="226" y="24" width="1" height="1"/></g>
  <g fill="#8b949e"><rect x="33" y="22" width="1" height="1"/><rect x="180" y="6" width="1" height="1"/><rect x="120" y="4" width="1" height="1"/></g>
  <!-- ventana con persiana -->
  <rect x="8" y="14" width="40" height="32" fill="#16243d"/>
  <g fill="#1f3354"><rect x="8" y="17" width="40" height="2"/><rect x="8" y="23" width="40" height="2"/><rect x="8" y="29" width="40" height="2"/><rect x="8" y="35" width="40" height="2"/><rect x="8" y="41" width="40" height="2"/></g>
  <rect x="38" y="18" width="4" height="4" fill="#ffd27a"/>
  <!-- escritorio -->
  <rect x="60" y="52" width="140" height="4" fill="#3a2a1e"/>
  <rect x="64" y="56" width="4" height="20" fill="#2a1d14"/><rect x="192" y="56" width="4" height="20" fill="#2a1d14"/>
  <!-- monitor -->
  <rect x="96" y="20" width="56" height="30" fill="#1b2433"/>
  <rect x="99" y="23" width="50" height="24" fill="#05101e"/>
  <svg x="99" y="23" width="50" height="24">
    <g class="code">
      <rect x="2" y="3" width="10" height="2" fill="#ff7a1a"/><rect x="14" y="3" width="16" height="2" fill="#c9d1d9"/><rect x="34" y="3" width="8" height="2" fill="#6cc4ff"/><rect x="50" y="3" width="10" height="2" fill="#ff7a1a"/><rect x="62" y="3" width="12" height="2" fill="#c9d1d9"/>
      <rect x="6" y="8" width="14" height="2" fill="#6cc4ff"/><rect x="22" y="8" width="10" height="2" fill="#c9d1d9"/><rect x="54" y="8" width="14" height="2" fill="#6cc4ff"/>
      <rect x="6" y="13" width="8" height="2" fill="#7ee787"/><rect x="16" y="13" width="20" height="2" fill="#c9d1d9"/><rect x="54" y="13" width="8" height="2" fill="#7ee787"/>
      <rect x="2" y="18" width="12" height="2" fill="#ff7a1a"/><rect x="50" y="18" width="12" height="2" fill="#ff7a1a"/>
    </g>
    <rect x="16" y="18" width="2" height="3" fill="#ffffff" class="blink"/>
  </svg>
  <rect x="120" y="50" width="8" height="2" fill="#1b2433"/>
  <!-- teclado y taza -->
  <rect x="104" y="49" width="40" height="3" fill="#2b3446"/>
  <rect x="166" y="44" width="6" height="8" fill="#ff7a1a"/><rect x="172" y="46" width="2" height="4" fill="#ff7a1a"/>
  <g fill="#8b949e" class="blink"><rect x="168" y="40" width="1" height="2"/><rect x="170" y="38" width="1" height="2"/></g>
  <!-- Sigi: candado-robot -->
  <g class="bob">
    <rect x="72" y="30" width="2" height="8" fill="#c9d1d9"/><rect x="82" y="30" width="2" height="8" fill="#c9d1d9"/><rect x="74" y="28" width="8" height="2" fill="#c9d1d9"/>
    <rect x="70" y="38" width="16" height="14" fill="#ff7a1a"/>
    <rect x="70" y="38" width="16" height="2" fill="#ffa25a"/>
    <g class="eye"><rect x="74" y="42" width="2" height="3" fill="#0a1220"/><rect x="80" y="42" width="2" height="3" fill="#0a1220"/></g>
    <rect x="76" y="47" width="4" height="1" fill="#0a1220"/>
    <rect x="77" y="25" width="2" height="3" fill="#8b949e"/><rect x="77" y="23" width="2" height="2" fill="#6cc4ff" class="blink"/>
  </g>
  <!-- firma -->
  <g fill="#ff7a1a">
    <text x="232" y="74" font-family="monospace" font-size="6" text-anchor="end">SIGILOCK</text>
  </g>
</svg>
